// emacs-ide.gradle —— 给任意 Gradle 工程生成 Eclipse/jdtls 可读的 .project + .classpath
//
// 用法（在工程根目录）：
//   gradlew -I <path-to>/emacs-ide.gradle emacsIdeFiles
//
// 为什么需要它：jdtls 自带 Buildship 导入在 NeoForge/ModDevGradle 工程里经常解析不到
// maven.modrinth 之类依赖（日志里是 "Unresolved dependency: maven.modrinth:..."），
// 于是 PlayerAnimationFactory 这类库类没有补全、还满屏红波浪线。
// 这里直接把 Gradle 已经解析好的 compileClasspath 写成 Eclipse 工程描述，
// jdtls 以“普通 Eclipse 项目”的方式加载，类路径 100% 与编译一致，且离线可用。

def esc = { String s ->
    s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
     .replace('"', '&quot;')
}

allprojects { p ->
    p.plugins.withId('java') {
        p.afterEvaluate {
            p.tasks.register('emacsIdeFiles') {
                group = 'ide'
                description = 'Generate .project/.classpath for Emacs (eglot/jdtls)'

                def projectDir = p.projectDir
                def projName = p.name
                def relativePath = { File f -> p.relativePath(f) ?: f.absolutePath }
                def srcDirs = p.sourceSets.main.java.srcDirs + p.sourceSets.main.resources.srcDirs
                def cp = p.configurations.compileClasspath

                doLast {
                    def srcs = srcDirs.findAll { it.exists() }
                                      .collect { relativePath(it) }
                                      .unique()

                    def projectXml = """<?xml version="1.0" encoding="UTF-8"?>
<projectDescription>
  <name>${esc(projName)}</name>
  <comment>generated by emacs-ide.gradle</comment>
  <projects></projects>
  <buildSpec>
    <buildCommand><name>org.eclipse.jdt.core.javabuilder</name><arguments></arguments></buildCommand>
  </buildSpec>
  <natures><nature>org.eclipse.jdt.core.javanature</nature></natures>
</projectDescription>
"""
                    new File(projectDir, '.project').text = projectXml

                    def sb = new StringBuilder()
                    sb << '<?xml version="1.0" encoding="UTF-8"?>\n<classpath>\n'
                    srcs.each { sb << "  <classpathentry kind=\"src\" path=\"${esc(it)}\"/>\n" }
                    sb << '  <classpathentry kind="con" path="org.eclipse.jdt.launching.JRE_CONTAINER"/>\n'
                    cp.files.sort { it.name }.each { f ->
                        if (f.exists() && f.name.endsWith('.jar')) {
                            // 必须用正斜杠：Eclipse 的 .classpath 解析器把反斜杠当转义符，
                            // 写成 C:\Users\... 的条目在 jdtls 导入时会被静默丢弃（类路径全空）。
                            def p2 = f.absolutePath.replace('\\', '/')
                            sb << "  <classpathentry kind=\"lib\" path=\"${esc(p2)}\"/>\n"
                        }
                    }
                    sb << '  <classpathentry kind="output" path="bin/main"/>\n</classpath>\n'
                    new File(projectDir, '.classpath').text = sb.toString()

                    println "[emacs-ide] wrote .project/.classpath for ${projName} " +
                            "(sources=${srcs.size()}, jars=${cp.files.count { it.name.endsWith('.jar') }})"
                }
            }
        }
    }
}
